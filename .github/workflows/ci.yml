name: CI

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify without paid providers
        env:
          LOCATION_SERVICE_TOKEN: test-only-location-service-token-32-bytes
          GOOGLE_MAPS_GATEWAY_TOKEN: test-only-google-maps-gateway-token-32-bytes
          GOOGLE_MAPS_ENABLED: "false"
        run: mvn -B verify
      - name: Dependency inventory
        if: always()
        run: mvn -B dependency:tree

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: |
          docker run --rm \
          --volume "$PWD:/repository:ro" \
          --workdir /repository \
          --entrypoint sh \
          zricethezav/gitleaks:v8.30.1 \
          -c 'git config --global --add safe.directory /repository && gitleaks git --no-banner --redact --log-opts=--all'

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package verified application
        env:
          LOCATION_SERVICE_TOKEN: test-only-location-service-token-32-bytes
          GOOGLE_MAPS_GATEWAY_TOKEN: test-only-google-maps-gateway-token-32-bytes
          GOOGLE_MAPS_ENABLED: "false"
        run: mvn -B -DskipTests package
      - name: Build hardened image
        run: docker build --tag "${{ github.event.repository.name }}:ci" .
      - name: Verify non-root runtime and health check
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "${{ github.event.repository.name }}:ci")" = "10001:10001"
          test "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' "${{ github.event.repository.name }}:ci")" != "null"
      - name: Scan image for Critical and High vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ github.event.repository.name }}:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          version: v0.72.0
