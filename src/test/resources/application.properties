LOCATION_SERVICE_TOKEN=test-only-location-service-token-32-bytes
GOOGLE_MAPS_GATEWAY_TOKEN=test-only-google-maps-gateway-token-32-bytes
server.port=0
spring.application.name=location-service-test
location.security.service-token=${LOCATION_SERVICE_TOKEN}
postcode.gateway.url=http://localhost:8082
google.maps.gateway.url=http://localhost:8105
google.maps.gateway.service-token=${GOOGLE_MAPS_GATEWAY_TOKEN}
google.maps.enabled=false
location.session.ttl=10m
location.session.maximum-entries=10000
location.search.minimum-characters=3
location.search.maximum-results=5
location.commute.maximum-destinations=5
