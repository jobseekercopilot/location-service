server.port=${SERVER_PORT:8104}
spring.application.name=location-service
location.security.service-token=${LOCATION_SERVICE_TOKEN}
postcode.gateway.url=${POSTCODE_IO_GATEWAY_URL:http://localhost:8082}
google.maps.gateway.url=${GOOGLE_MAPS_GATEWAY_URL:http://localhost:8105}
google.maps.gateway.service-token=${GOOGLE_MAPS_GATEWAY_TOKEN}
google.maps.enabled=${GOOGLE_MAPS_ENABLED:false}
location.session.ttl=${LOCATION_SESSION_TTL:10m}
location.session.maximum-entries=${LOCATION_SESSION_MAXIMUM_ENTRIES:10000}
location.search.minimum-characters=${LOCATION_SEARCH_MINIMUM_CHARACTERS:3}
location.search.maximum-results=${LOCATION_SEARCH_MAXIMUM_RESULTS:5}
location.commute.maximum-destinations=${LOCATION_COMMUTE_MAXIMUM_DESTINATIONS:5}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
