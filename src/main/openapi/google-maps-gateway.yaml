openapi: 3.0.3
info:
  title: Job Seeker Copilot Google Maps Gateway Internal API
  version: 1.0.0
  description: Internal provider boundary for Google Places API (New) and Routes API.
servers:
  - url: http://google-maps-gateway:8105
security:
  - serviceToken: []
paths:
  /internal/v1/places/autocomplete:
    post:
      operationId: autocompletePlaces
      tags: [Places]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutocompleteRequest'
      responses:
        '200':
          description: Bounded Google place references and transient display text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutocompleteResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
  /internal/v1/places/resolve:
    post:
      operationId: resolvePlace
      tags: [Places]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: Narrow transient Google place details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceDetails'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
  /internal/v1/routes/matrix:
    post:
      operationId: computeRouteMatrix
      tags: [Routes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommuteMatrixRequest'
      responses:
        '200':
          description: Transient per-mode route estimates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommuteMatrixResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  responses:
    Error:
      description: Stable redacted error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    AutocompleteRequest:
      type: object
      required: [input, sessionId, countryCodes]
      properties:
        input:
          type: string
          minLength: 3
          maxLength: 200
        sessionId:
          type: string
          format: uuid
        countryCodes:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [GB]
    AutocompleteResponse:
      type: object
      required: [sessionId, suggestions]
      properties:
        sessionId:
          type: string
          format: uuid
        suggestions:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Suggestion'
    Suggestion:
      type: object
      required: [providerReference, primaryText, precisionHint]
      properties:
        providerReference:
          type: string
        primaryText:
          type: string
        secondaryText:
          type: string
          nullable: true
        precisionHint:
          $ref: '#/components/schemas/Precision'
    ResolveRequest:
      type: object
      required: [providerReference, sessionId]
      properties:
        providerReference:
          type: string
        sessionId:
          type: string
          format: uuid
    PlaceDetails:
      type: object
      required: [providerReference, observedAt]
      properties:
        providerReference:
          type: string
        displayText:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        locality:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        countryCode:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        observedAt:
          type: string
          format: date-time
    CommuteMatrixRequest:
      type: object
      required: [origin, destinations, modes, departureTime]
      properties:
        origin:
          $ref: '#/components/schemas/RoutePoint'
        destinations:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/RoutePoint'
        modes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TravelMode'
        departureTime:
          type: string
          format: date-time
    RoutePoint:
      type: object
      required: [referenceId, latitude, longitude, precision]
      properties:
        referenceId:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        precision:
          $ref: '#/components/schemas/Precision'
    CommuteMatrixResponse:
      type: object
      required: [estimates]
      properties:
        estimates:
          type: array
          items:
            $ref: '#/components/schemas/CommuteEstimate'
    CommuteEstimate:
      type: object
      required: [destinationReferenceId, mode, status, calculatedFor]
      properties:
        destinationReferenceId:
          type: string
        mode:
          $ref: '#/components/schemas/TravelMode'
        status:
          type: string
          enum: [ESTIMATED, APPROXIMATE, UNAVAILABLE]
        durationMinutes:
          type: integer
          nullable: true
          minimum: 0
        distanceMiles:
          type: number
          format: double
          nullable: true
          minimum: 0
        calculatedFor:
          type: string
          format: date-time
        reasonCode:
          type: string
          nullable: true
        providerAttribution:
          type: string
          nullable: true
          enum: [GOOGLE_MAPS]
    Precision:
      type: string
      enum: [EXACT_ADDRESS, POSTCODE_CENTROID, LOCALITY_CENTROID, PROVIDER_COORDINATE, NONE]
    TravelMode:
      type: string
      enum: [DRIVE, TRANSIT]

